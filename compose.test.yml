name: lunch-together-test
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lunch_test
      POSTGRES_USER: lunch_test
      POSTGRES_PASSWORD: disposable_test_password
    ports:
      - "127.0.0.1:55436:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunch_test -d lunch_test"]
      interval: 2s
      timeout: 3s
      retries: 20
