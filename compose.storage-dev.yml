name: lunch-together-storage-dev
services:
  minio:
    image: lunch-together-test-minio:2025-09-07
    build:
      context: .
      dockerfile: docker/minio-test.Dockerfile
    command: server /data
    environment:
      MINIO_ROOT_USER: lunch_dev_storage
      MINIO_ROOT_PASSWORD: local_development_storage_password
    ports:
      - "127.0.0.1:55438:9000"
    volumes:
      - photos:/data
volumes:
  photos:
